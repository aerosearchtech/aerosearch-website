<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aerosearch Technologies</title>
<!-- TAB ICON -->
<link rel="icon" type="image/png" href="favicon.ico">
<link rel="shortcut icon" href="favicon.ico">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: black;
    color: white;
    overflow-x: hidden;
}

/* SCROLL SNAP */
.container {
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    height: 100vh;
}

.section {
    scroll-snap-align: start;
    height: 100vh;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 100px 60px;
}

/* BACKGROUND IMAGE */
.section::before {
    content: "";
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    z-index: -1;
    filter: brightness(0.6);
}

/* DIFFERENT BACKGROUNDS */
.sec1::before { background-image: url("hero.png"); }
.sec2::before { background-image: url("hero22.png"); }
.sec3::before { background-image: url("hero.png"); }

/* HEADER */
header {
    position: fixed;
    width: 100%;
    top: 0;
    padding: 20px 50px;
    display: flex;
    justify-content: space-between;
    z-index: 1000;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    height: 40px;
}

nav a {
    color: white;
    margin-left: 25px;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    position: relative;
}

nav a::after {
    content: "";
    position: absolute;
    width: 0;
    height: 1px;
    bottom: -4px;
    left: 0;
    background: white;
    transition: 0.3s;
}

nav a:hover::after {
    width: 100%;
}

/* TEXT */
.content {
    max-width: 600px;
    opacity: 0;
    transform: translateY(40px);
    transition: 1s ease;
}

.content.show {
    opacity: 1;
    transform: translateY(0);
}

.content h1 {
    font-size: 52px;
    margin-bottom: 15px;
}

.content p {
    font-size: 16px;
    margin-bottom: 20px;
}

.btn {
    border: 2px solid white;
    padding: 10px 25px;
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background: white;
    color: black;
}

/* MOBILE */
@media (max-width: 768px) {

    .section {
        padding: 100px 20px;
    }

    .content h1 {
        font-size: 30px;
    }

    nav {
        display: none;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <img src="logo.png">
        <span>AEROSEARCH</span>
    </div>

    <nav>
        <a href="#">ABOUT</a>
        <!-- <a href="#">TECH</a>-->
        <!-- <a href="#">SERVICES</a>-->
        <a href="#">CONTACT</a>
    </nav>
</header>

<div class="container">

    <!-- SECTION 1 -->
    <section class="section sec1">
        <div class="content">
            <h1>RESEARCH-DRIVEN INNOVATIONS</h1>
            <nav> <a href="#"><p>Advanced drone intelligence powered by AI</p></a></nav>
            <!-- <a href="#" class="btn">LEARN MORE</a>-->
        </div>
    </section>

    <!-- SECTION 2 -->
    <section class="section sec2">
        <div class="content">
            <h1>SENSOR FUSION TECHNOLOGY</h1>
            <nav> <a href="#"><p>Sensor Fusion for Autonomous UAVs in defense & industry</p></a></nav>
            <!-- <a href="#" class="btn">EXPLORE</a>-->
        </div>
    </section>

    <!-- SECTION 3 -->
    <section class="section sec3">
        <div class="content">
            <h1>INTELLIGENT OBJECT DETECTION</h1>
           <nav> <a href="#"><p>Turning aerial data into real-time object detection</p></a></nav>
           <!--  <a href="#" class="btn">DISCOVER</a>-->
        </div>
    </section>

</div>

<script>
/* SCROLL ANIMATION */
const contents = document.querySelectorAll(".content");

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("show");
        }
    });
}, { threshold: 0.3 });

contents.forEach(el => observer.observe(el));
</script>

</body>
</html>
